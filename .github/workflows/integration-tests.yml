# Fork-safe public integration checks. This intentionally replaces, not emulates,
# the private smartcontractkit ECR/CRE/CCIP integration workflow.
name: Integration Tests (Public Fork)
run-name: Public Integration ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      run_go_tests:
        description: Run repository Go package tests (can require substantial download/build time)
        type: boolean
        required: false
        default: true
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: fork-public-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHAINLINK_IMAGE: public.ecr.aws/chainlink/chainlink:2.70.0
  CHAINLINK_IMAGE_TAG: '2.70.0'

jobs:
  public-image:
    name: Validate published Chainlink image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve public image manifest
        shell: bash
        run: |
          set -euo pipefail
          docker manifest inspect "$CHAINLINK_IMAGE" > /tmp/chainlink-manifest.json
          python3 - <<'PY'
          import json
          with open('/tmp/chainlink-manifest.json', encoding='utf-8') as f:
              index = json.load(f)
          platforms = {
              (m.get('platform') or {}).get('os', '') + '/' + (m.get('platform') or {}).get('architecture', '')
              for m in index.get('manifests', [])
          }
          assert 'linux/amd64' in platforms, f'Expected linux/amd64; found {platforms}'
          print('Public image manifest OK; platforms:', ', '.join(sorted(platforms)))
          PY
      - name: Pull and inspect image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$CHAINLINK_IMAGE"
          docker image inspect "$CHAINLINK_IMAGE" --format 'ID={{.Id}} OS={{.Os}} ARCH={{.Architecture}}'
      - name: Check Chainlink executable is present
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "$CHAINLINK_IMAGE" -ec 'command -v chainlink'

  public-go-tests:
    name: Go package tests (fork code)
    if: github.event_name != 'workflow_dispatch' || inputs.run_go_tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Determine Go toolchain from module
        id: go-version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '$1 == "go" { print $2; exit }' go.mod)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Repository Go version: $version"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: true
      - name: Test core/store/models package
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=10m ./core/store/models
      - name: Test core/utils package
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout=10m ./core/utils

  coverage-boundary:
    name: Report private E2E tests blocked
    if: always()
    needs: [public-image, public-go-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Record honest qualification
        env:
          IMAGE_RESULT: ${{ needs.public-image.result }}
          GO_RESULT: ${{ needs.public-go-tests.result }}
        shell: bash
        run: |
          {
            echo '## Public fork validation'
            echo "- Public Chainlink image checks: **${IMAGE_RESULT}**"
            echo "- Fork Go package tests: **${GO_RESULT}**"
            echo '- **BLOCKED / NOT RUN:** CRE system E2E (private AWS services/images, runners, credentials)'
            echo '- **BLOCKED / NOT RUN:** CCIP system E2E (private AWS services/images, runners, credentials)'
            echo '- **NOT DEMONSTRATED:** CRE DON deployment, mainnet settlement, payment, or live end-to-end finality'
            echo '- Do not interpret a green result as a full Chainlink integration-suite pass.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IMAGE_RESULT" != success ]; then
            echo '::error::Public image validation failed or did not execute'
            exit 1
          fi
          if [ "$GO_RESULT" != success ] && [ "$GO_RESULT" != skipped ]; then
            echo '::error::Fork Go package tests failed or did not execute'
            exit 1
          fi
          echo '::notice::Private CRE and CCIP E2E suites remain BLOCKED and were not run.'
